<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml"
    href="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Google_%22G%22_logo.svg/768px-Google_%22G%22_logo.svg.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaironex Interviewer</title>
  <script>
    // Capture runtime errors
    window.onerror = function (msg, url, lineNo, columnNo, error) {
      document.body.innerHTML += '<div style="background:red;color:white;padding:20px;font-size:16px;border-bottom:1px solid white;">' +
        '<strong>JS Error:</strong> ' + msg + '<br/>' +
        '<small>' + url + ':' + lineNo + '</small>' +
        '<pre>' + (error ? error.stack : '') + '</pre>' +
        '</div>';
      return false;
    };

    // Capture Promise rejections
    window.addEventListener('unhandledrejection', function (event) {
      document.body.innerHTML += '<div style="background:orange;color:white;padding:20px;font-size:16px;border-bottom:1px solid white;">' +
        '<strong>Promise Rejection:</strong> ' + event.reason +
        '</div>';
    });

    // Capture Resource Loading Errors (img, script, css) - Use Capture Phase
    window.addEventListener('error', function (event) {
      if (event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK' || event.target.tagName === 'IMG')) {
        document.body.innerHTML += '<div style="background:darkred;color:white;padding:20px;font-size:16px;border-bottom:1px solid white;">' +
          '<strong>Resource Load Failed:</strong> ' + (event.target.src || event.target.href) +
          '</div>';
      }
    }, true);
  </script>
  <script type="module" crossorigin src="./assets/index-DLhroazZ.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DwMecR8J.css">
</head>

<body>
  <script>console.log("HTML Body Start");</script>
  <div id="root">
    <div style="padding:20px; text-align:center;">Initializing App...</div>
  </div>
</body>

</html>
